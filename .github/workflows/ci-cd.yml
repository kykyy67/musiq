name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and verification
        run: ./mvnw clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: musicservice:ci

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}

    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] || [ -z "$APP_HEALTHCHECK_URL" ]; then
            echo "Deploy secrets are not configured. Deploy steps will be skipped."
          else
            echo "Deploy secrets are configured."
          fi

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.APP_HEALTHCHECK_URL != ''
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for application startup
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.APP_HEALTHCHECK_URL != ''
        run: sleep 45

      - name: Verify production healthcheck
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.APP_HEALTHCHECK_URL != ''
        run: curl -fsSL "$APP_HEALTHCHECK_URL"
